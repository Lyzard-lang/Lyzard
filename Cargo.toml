[package]
name    = "lyzard"
version = "0.1.0"
edition = "2021"

[dependencies]
# nothing yet — LYZARD core has ZERO external dependencies

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "lexer_bench"
harness = false

[profile.release]
opt-level  = 3
lto        = true
codegen-units = 1
panic      = "abort"
